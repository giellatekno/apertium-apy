# Enables /translateLLM. Add this section to the config file you pass to
# apertium-apy with -C (next to the [APY] section, see config.example.conf).
#
# The API key is read from the environment variable APY_LLM_API_KEY.
# (`api_key = ...` in this section also works, but keeps the secret on disk.)

[LLM]
# enabled = yes

# Chat completions URL. {model} is replaced by the `model` value below; with
# Azure OpenAI the model is chosen by the deployment name in the URL.
endpoint = https://gw-uit.intark.uh-it.no/azure-openai/openai/deployments/{model}/chat/completions?api-version=2024-02-01
model = gpt-35-turbo

# Header carrying the key: "api-key" for Azure, "Authorization" for plain
# OpenAI (then put "Bearer sk-..." in APY_LLM_API_KEY).
api_key_header = api-key

# Plain OpenAI needs the model in the request body; Azure doesn't.
# include_model_in_body = no

temperature = 0.15
# Seconds before giving up on the LLM and returning the Apertium output
timeout = 30
# Longer inputs skip the LLM (llmStatus "too_long")
max_chars = 10000

# System prompt. {source_lang} and {target_lang} are replaced by ISO 639-3
# codes. Continuation lines must be indented. Leave both prompt and
# prompt_file out to use the built-in default (see utils/llm_postedit.py).
# prompt = You post-edit machine translation into {target_lang}.
#     Make it idiomatic, keep the meaning. Reply with the text only.
#
# Or read the prompt from a file, relative to this config file:
# prompt_file = llm-prompt.txt
